<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hazelnut Factory | 3D Box Customizer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/tween.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* Brand Header - Minimal */
        .brand-header {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
        }

        .brand-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            letter-spacing: 1px;
        }

        /* 3D Viewer - Full screen center */
        #threejs-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
        }

        /* Semi-Circular Control - Left Side */
        .control-dial {
            position: absolute;
            top: 50%;
            left: 40px;
            transform: translateY(-50%);
            width: 120px;
            height: 240px;
            z-index: 100;
        }

        .dial-background {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 60px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
        }

        .control-item {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            border: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            z-index: 101;
            left: 25px;
        }

        .control-item:hover {
            border-color: #4a6fa5;
            transform: scale(1.05);
        }

        .control-item.active {
            background: #4a6fa5;
            border-color: #4a6fa5;
            color: white;
        }

        .control-item.active .control-icon {
            color: white;
        }

        .control-item.active .control-label {
            color: white;
        }

        /* Position controls in semi-circle */
        .control-item:nth-child(1) {
            top: 20px;
        }

        .control-item:nth-child(2) {
            top: 85px;
        }

        .control-item:nth-child(3) {
            top: 150px;
        }

        .control-item:nth-child(4) {
            top: 215px;
        }

        .control-icon {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 4px;
        }

        .control-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #666;
            letter-spacing: 0.5px;
        }

        /* Sub-options Panel */
        .sub-options {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid #e0e0e0;
            z-index: 100;
            display: none;
        }

        .sub-options.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .sub-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Box Size Options */
        .size-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .size-option {
            padding: 20px 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .size-option:hover {
            border-color: #4a6fa5;
            background: #f0f4ff;
        }

        .size-option.active {
            background: #4a6fa5;
            border-color: #4a6fa5;
            color: white;
        }

        .size-label {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .size-desc {
            font-size: 0.85rem;
            color: #666;
        }

        .size-option.active .size-desc {
            color: rgba(255, 255, 255, 0.9);
        }

        /* Color Options */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }

        .color-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            position: relative;
        }

        .color-option:hover {
            transform: scale(1.1);
        }

        .color-option.active {
            border-color: #333;
            transform: scale(1.1);
        }

        .color-option.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }

        /* Ribbon Options */
        .ribbon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .ribbon-option {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .ribbon-option:hover {
            border-color: #4a6fa5;
            background: #f0f4ff;
        }

        .ribbon-option.active {
            background: #4a6fa5;
            border-color: #4a6fa5;
            color: white;
        }

        .ribbon-label {
            font-weight: 600;
            font-size: 1rem;
        }

        /* Sweet Options */
        .sweet-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .sweet-option {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .sweet-option:hover {
            border-color: #4a6fa5;
            background: #f0f4ff;
        }

        .sweet-option.selected {
            background: #4a6fa5;
            border-color: #4a6fa5;
            color: white;
        }

        .sweet-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .sweet-option.selected .sweet-icon {
            background: white;
            color: #4a6fa5;
        }

        .sweet-name {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .sweet-price {
            font-size: 0.85rem;
            color: #666;
        }

        .sweet-option.selected .sweet-price {
            color: rgba(255, 255, 255, 0.9);
        }

        /* Quantity Controls */
        .quantity-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 10px;
            gap: 10px;
        }

        .qty-btn {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            color: inherit;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-display {
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        /* Capacity Indicator */
        .capacity-indicator {
            position: absolute;
            bottom: 200px;
            right: 40px;
            background: white;
            border-radius: 15px;
            padding: 15px 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
            z-index: 100;
            text-align: center;
            min-width: 150px;
        }

        .capacity-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .capacity-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #333;
        }

        .capacity-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .capacity-fill {
            height: 100%;
            background: #4a6fa5;
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* MRP Display */
        .mrp-display {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: white;
            border-radius: 15px;
            padding: 20px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid #e0e0e0;
            z-index: 100;
            text-align: center;
            min-width: 150px;
        }

        .mrp-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .mrp-value {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
        }

        /* Action Buttons */
        .action-buttons {
            position: absolute;
            top: 30px;
            right: 40px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .action-btn {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn {
            background: white;
            color: #666;
            border: 2px solid #e0e0e0;
        }

        .reset-btn:hover {
            background: #f8f9fa;
            border-color: #4a6fa5;
            color: #4a6fa5;
        }

        .cart-btn {
            background: #4a6fa5;
            color: white;
            border: 2px solid #4a6fa5;
        }

        .cart-btn:hover {
            background: #3a5a95;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74, 111, 165, 0.3);
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4a6fa5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Animation Notification */
        .sweet-animation-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(74, 111, 165, 0.9);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .brand-header {
                left: 20px;
                top: 20px;
            }
            
            .control-dial {
                left: 20px;
                width: 100px;
                height: 200px;
            }
            
            .control-item {
                width: 60px;
                height: 60px;
                left: 20px;
            }
            
            .control-item:nth-child(1) { top: 15px; }
            .control-item:nth-child(2) { top: 70px; }
            .control-item:nth-child(3) { top: 125px; }
            .control-item:nth-child(4) { top: 180px; }
            
            .sub-options {
                width: 90%;
                padding: 20px;
                bottom: 80px;
            }
            
            .action-buttons {
                top: 20px;
                right: 20px;
                flex-direction: column;
                gap: 10px;
            }
            
            .mrp-display, .capacity-indicator {
                bottom: 20px;
                right: 20px;
                padding: 15px 20px;
            }
            
            .capacity-indicator {
                bottom: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-name">THE HAZELNUT FACTORY</div>
        </div>

        <!-- 3D Canvas -->
        <canvas id="threejs-canvas"></canvas>

        <!-- Semi-Circular Control Dial -->
        <div class="control-dial">
            <div class="dial-background"></div>
            <div class="control-item active" data-control="box">
                <i class="fas fa-box control-icon"></i>
                <div class="control-label">BOX</div>
            </div>
            <div class="control-item" data-control="content">
                <i class="fas fa-candy-cane control-icon"></i>
                <div class="control-label">CONTENT</div>
            </div>
            <div class="control-item" data-control="colour">
                <i class="fas fa-palette control-icon"></i>
                <div class="control-label">COLOUR</div>
            </div>
            <div class="control-item" data-control="ribbon">
                <i class="fas fa-ribbon control-icon"></i>
                <div class="control-label">RIBBON</div>
            </div>
        </div>

        <!-- Sub-options Panel -->
        <div class="sub-options active" id="sub-options">
            <div class="sub-title">SELECT BOX SIZE</div>
            <div class="size-grid" id="size-grid">
                <div class="size-option active" data-size="14">
                    <div class="size-label">14 Pc</div>
                    <div class="size-desc">Small Box</div>
                </div>
                <div class="size-option" data-size="20">
                    <div class="size-label">20 Pc</div>
                    <div class="size-desc">Medium Box</div>
                </div>
                <div class="size-option" data-size="30">
                    <div class="size-label">30 Pc</div>
                    <div class="size-desc">Large Box</div>
                </div>
            </div>
        </div>

        <!-- Capacity Indicator -->
        <div class="capacity-indicator" id="capacity-indicator">
            <div class="capacity-label">CAPACITY</div>
            <div class="capacity-value" id="capacity-value">0/14</div>
            <div class="capacity-bar">
                <div class="capacity-fill" id="capacity-fill"></div>
            </div>
        </div>

        <!-- MRP Display -->
        <div class="mrp-display">
            <div class="mrp-label">MRP</div>
            <div class="mrp-value" id="mrp-value">₹1,499</div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn reset-btn" id="reset-btn">
                <i class="fas fa-redo"></i> RESET
            </button>
            <button class="action-btn cart-btn" id="cart-btn">
                <i class="fas fa-shopping-cart"></i> ADD TO CART
            </button>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="loader"></div>
            <div>Loading 3D Model...</div>
        </div>

        <!-- Animation Notification -->
        <div class="sweet-animation-notification" id="sweet-animation-notification"></div>
    </div>

    <script>
        // Three.js variables
        let scene, camera, renderer, controls, boxModel;
        
        // Model parts
        let modelParts = {
            mainBox: null,
            lidClosed: null,
            lidOpen: null,
            slotContainer: null,
            slots: [],
            sweetMeshes: {}, // Map of sweet ID to mesh in scene
            slotPositions: [] // Pre-calculated slot positions
        };

        // State
        let currentState = {
            boxSize: '14',
            boxColor: '#ff6b9d',
            ribbon: 'red',
            selectedSweets: {},
            activeControl: 'box',
            lidOpen: false,
            filledSlots: new Set() // Track which slots are filled
        };

        // Colors
        const colors = [
            { name: 'Red', value: '#ff4757' },
            { name: 'Blue', value: '#6ce5ff' },
            { name: 'Green', value: '#32cd32' },
            { name: 'Pink', value: '#ff6b9d' },
            { name: 'Purple', value: '#9370db' },

            },

            {

            }
        ];

        // Box sizes with prices
        const boxSizes = {
            '14': { price: 1499, capacity: 14 },
            '20': { price: 1999, capacity: 20 },
            '30': { price: 2499, capacity: 30 }
        };

        // DOM Elements
        const canvas = document.getElementById('threejs-canvas');
        const loadingOverlay = document.getElementById('loading-overlay');
        const controlItems = document.querySelectorAll('.control-item');
        const subOptions = document.getElementById('sub-options');
        const subTitle = subOptions.querySelector('.sub-title');
        const sizeGrid = document.getElementById('size-grid');
        const mrpValue = document.getElementById('mrp-value');
        const capacityValue = document.getElementById('capacity-value');

        // Initialize
        function init() {
            setupEventListeners();
            initThreeJS();
            updateCapacity();
            updateMRP();
        }

        // Initialize Three.js
        function initThreeJS() {
            // Create scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f7fa);
            
            // Create camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 8);
            
            // Create renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            
            // Add controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 5;
            controls.maxDistance = 15;
            controls.maxPolarAngle = Math.PI / 2;
            
            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Create box model with slots
            createBoxModelWithSlots();
            
            // Start animation
            animate();
            
            // Hide loading
            setTimeout(() => {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => {
                    loadingOverlay.style.display = 'none';
                }, 300);
            }, 1500);
            
            // Handle resize
            window.addEventListener('resize', onWindowResize);
        }

        // Create box model with slots based on your structure
function createBoxModelWithSlots() {
    // Create a group to hold everything
    const boxGroup = new THREE.Group();
    boxGroup.name = 'BakedPalmTreeBox';
        
    // Load your actual 3D model
    const loader = new THREE.GLTFLoader();
    
    // Optional: Add DRACO loader for compressed models
    // const dracoLoader = new THREE.DRACOLoader();
    // dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
    // loader.setDRACOLoader(dracoLoader);
    
    // Load your model file
    loader.load(
        'assets/models/palm_tree box_30_open.glb', // Replace with your model file path
        (gltf) => {
            const model = gltf.scene;
            
            // Scale and position the model
            model.scale.set(0.5, 0.5, 0.5);
            model.position.y = 0;
            
            // Enable shadows
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    
                    // Store original material for color changes
                    child.userData.originalMaterial = child.material.clone();
                }
            });
            
            boxGroup.add(model);
            
            // Organize model parts based on your structure
            organizeModelParts(model);
            
            // Generate slot positions (if not baked into model)
            generateSlotPositions();
            
            // Initialize lid state
            setLidState('closed');
            
            // Update colors
            updateBoxColor();
            
        },
        (progress) => {
            // Loading progress
            console.log('Loading model:', (progress.loaded / progress.total * 100) + '%');
        },
        (error) => {
            console.error('Error loading model:', error);
            // Fallback to procedural model
            createProceduralBox();
        }
    );
    
    scene.add(boxGroup);
    boxModel = boxGroup;
}

        function createDecorativeElements(parent) {
            // Ribbon around the box
            const ribbonGeometry = new THREE.BoxGeometry(2.2, 0.05, 0.1);
            const ribbonMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff0000, // Red ribbon
                roughness: 0.2,
                metalness: 0.5
            });
            
            const ribbonHorizontal = new THREE.Mesh(ribbonGeometry, ribbonMaterial);
            ribbonHorizontal.position.y = 0.75;
            ribbonHorizontal.position.z = 0;
            ribbonHorizontal.name = 'ribbon_horizontal';
            parent.add(ribbonHorizontal);
            
            const ribbonVertical = new THREE.Mesh(ribbonGeometry, ribbonMaterial);
            ribbonVertical.position.y = 0.75;
            ribbonVertical.position.x = 0;
            ribbonVertical.rotation.y = Math.PI / 2;
            ribbonVertical.name = 'ribbon_vertical';
            parent.add(ribbonVertical);
            
            // Bow on top
            const bowGeometry = new THREE.TorusKnotGeometry(0.08, 0.03, 100, 16);
            const bowMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff0000,
                roughness: 0.2,
                metalness: 0.5
            });
            
            const bow = new THREE.Mesh(bowGeometry, bowMaterial);
            bow.position.y = 0.95;
            bow.scale.set(1.5, 1, 1.5);
            bow.name = 'bow';
            parent.add(bow);
        }

        // Toggle lid open/closed
        function toggleLid() {
            if (currentState.lidOpen) {
                // Close lid
                modelParts.lidOpen.visible = false;
                modelParts.lidClosed.visible = true;
                currentState.lidOpen = false;
            } else {
                // Open lid
                modelParts.lidClosed.visible = false;
                modelParts.lidOpen.visible = true;
                currentState.lidOpen = true;
            }
        }

        // Create sweet mesh
        function createSweetMesh(sweet) {
            // Create a sphere for the sweet
            const geometry = new THREE.SphereGeometry(sweet.size, 16, 16);
            const material = new THREE.MeshStandardMaterial({ 
                color: sweet.color,
                roughness: 0.3,
                metalness: 0.1
            });
            
            const sweetMesh = new THREE.Mesh(geometry, material);
            sweetMesh.castShadow = true;
            sweetMesh.receiveShadow = true;
            sweetMesh.userData = { sweetId: sweet.id };
            
            return sweetMesh;
        }

        // Find empty slot
        function findEmptySlot() {
            const capacity = boxSizes[currentState.boxSize].capacity;
            
            // Only check slots up to capacity
            for (let i = 1; i <= capacity; i++) {
                if (!currentState.filledSlots.has(i)) {
                    return i;
                }
            }
            return null;
        }

        // Add sweet to box with animation
        async function addSweetToBox(sweet) {
            const capacity = boxSizes[currentState.boxSize].capacity;
            const totalSweets = Object.values(currentState.selectedSweets).reduce((a, b) => a + b, 0);
            
            // Check capacity
            if (totalSweets >= capacity) {
                showSweetAnimation(`Box is full! (${capacity} max)`, true);
                return null;
            }
            
            // Find empty slot
            const slotIndex = findEmptySlot();
            if (!slotIndex) {
                showSweetAnimation('No empty slots available!', true);
                return null;
            }
            
            // Open lid if closed
            if (!currentState.lidOpen) {
                toggleLid();
            }
            
            // Show animation notification
            showSweetAnimation(`Adding ${sweet.name}...`);
            
            // Create sweet mesh
            const sweetMesh = createSweetMesh(sweet);
            
            // Start position above the box
            sweetMesh.position.set(0, 3, 0);
            sweetMesh.scale.set(0.1, 0.1, 0.1);
            scene.add(sweetMesh);
            
            // Target position (slot position)
            const targetPosition = modelParts.slotPositions[slotIndex].clone();
            targetPosition.y += 0.1; // Slight offset above slot
            
            // Animate sweet falling into box
            await animateSweetToSlot(sweetMesh, targetPosition, slotIndex);
            
            // Mark slot as filled
            currentState.filledSlots.add(slotIndex);
            
            // Store sweet mesh reference
            if (!modelParts.sweetMeshes[sweet.id]) {
                modelParts.sweetMeshes[sweet.id] = [];
            }
            modelParts.sweetMeshes[sweet.id].push({
                mesh: sweetMesh,
                slotIndex: slotIndex
            });
            
            showSweetAnimation(`${sweet.name} added!`);
            return slotIndex;
        }

        // Remove sweet from box with animation
        async function removeSweetFromBox(sweet) {
            const sweetInstances = modelParts.sweetMeshes[sweet.id];
            if (!sweetInstances || sweetInstances.length === 0) {
                return null;
            }
            
            // Get the last added sweet of this type
            const sweetData = sweetInstances[sweetInstances.length - 1];
            const sweetMesh = sweetData.mesh;
            const slotIndex = sweetData.slotIndex;
            
            // Show animation notification
            showSweetAnimation(`Removing ${sweet.name}...`);
            
            // Open lid if closed
            if (!currentState.lidOpen) {
                toggleLid();
            }
            
            // Animate sweet out of box
            await animateSweetOut(sweetMesh);
            
            // Remove from scene
            scene.remove(sweetMesh);
            
            // Clean up references
            modelParts.sweetMeshes[sweet.id].pop();
            if (modelParts.sweetMeshes[sweet.id].length === 0) {
                delete modelParts.sweetMeshes[sweet.id];
            }
            
            // Mark slot as empty
            currentState.filledSlots.delete(slotIndex);
            
            showSweetAnimation(`${sweet.name} removed!`);
            return slotIndex;
        }

        // Animate sweet to slot
        function animateSweetToSlot(sweetMesh, targetPosition, slotIndex) {
            return new Promise((resolve) => {
                // Calculate control point for arc animation
                const startPos = sweetMesh.position.clone();
                const controlPoint = new THREE.Vector3(
                    (startPos.x + targetPosition.x) / 2,
                    startPos.y,
                    (startPos.z + targetPosition.z) / 2
                );
                
                const duration = 1000; // 1 second
                const startTime = Date.now();
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // Quadratic bezier curve for arc motion
                    const t = progress;
                    const x = (1 - t) * (1 - t) * startPos.x + 
                              2 * (1 - t) * t * controlPoint.x + 
                              t * t * targetPosition.x;
                    const y = (1 - t) * (1 - t) * startPos.y + 
                              2 * (1 - t) * t * (controlPoint.y + 2) + // Higher arc
                              t * t * targetPosition.y;
                    const z = (1 - t) * (1 - t) * startPos.z + 
                              2 * (1 - t) * t * controlPoint.z + 
                              t * t * targetPosition.z;
                    
                    // Scale up as it falls
                    const scale = 0.1 + (0.9 * progress);
                    
                    sweetMesh.position.set(x, y, z);
                    sweetMesh.scale.set(scale, scale, scale);
                    
                    // Slight rotation
                    sweetMesh.rotation.y = progress * Math.PI * 2;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // Final position adjustment
                        sweetMesh.position.copy(targetPosition);
                        sweetMesh.scale.set(1, 1, 1);
                        resolve();
                    }
                }
                
                animate();
            });
        }

        // Animate sweet out of box
        function animateSweetOut(sweetMesh) {
            return new Promise((resolve) => {
                const startPos = sweetMesh.position.clone();
                const targetPos = startPos.clone();
                targetPos.y = 3; // Move up out of box
                
                const duration = 800; // 0.8 seconds
                const startTime = Date.now();
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // Ease out cubic
                    const eased = 1 - Math.pow(1 - progress, 3);
                    
                    const y = startPos.y + (targetPos.y - startPos.y) * eased;
                    sweetMesh.position.y = y;
                    
                    // Scale down as it rises
                    const scale = 1 - (0.9 * progress);
                    sweetMesh.scale.set(scale, scale, scale);
                    
                    // Fade out
                    sweetMesh.material.opacity = 1 - progress;
                    sweetMesh.material.transparent = true;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        resolve();
                    }
                }
                
                animate();
            });
        }

        // Show sweet animation notification
        function showSweetAnimation(text, isError = false) {
            sweetAnimationNotification.textContent = text;
            sweetAnimationNotification.style.background = isError 
                ? 'rgba(255, 71, 87, 0.9)' 
                : 'rgba(74, 111, 165, 0.9)';
            
            sweetAnimationNotification.style.opacity = '1';
            
            setTimeout(() => {
                sweetAnimationNotification.style.opacity = '0';
            }, 1500);
        }

        // Update box color
        function updateBoxColor() {
            if (modelParts.mainBox) {
                modelParts.mainBox.material.color.set(currentState.boxColor);
            }
            
            // Update ribbon color
            scene.traverse((child) => {
                if (child.name && (child.name.includes('ribbon') || child.name === 'bow')) {
                    const ribbonColor = getRibbonColor(currentState.ribbon);
                    child.material.color.set(ribbonColor);
                }
            });
        }

        // Get ribbon color
        function getRibbonColor(ribbonType) {
            switch(ribbonType) {
                case 'red': return 0xff0000;
                case 'blue': return 0x0066ff;
                case 'gold': return 0xffd700;
                case 'silver': return 0xc0c0c0;
                default: return 0xff0000;
            }
        }

        // Update capacity display
        function updateCapacity() {
            const totalSweets = Object.values(currentState.selectedSweets).reduce((a, b) => a + b, 0);
            const capacity = boxSizes[currentState.boxSize].capacity;
            const percentage = (totalSweets / capacity) * 100;
            
            capacityValue.textContent = `${totalSweets}/${capacity}`;
            capacityFill.style.width = `${percentage}%`;
            
            // Change color based on fill level
            if (percentage > 90) {
                capacityFill.style.background = '#ff4757'; // Red
            } else if (percentage > 70) {
                capacityFill.style.background = '#ffa500'; // Orange
            } else {
                capacityFill.style.background = '#4a6fa5'; // Blue
            }
        }

        // Update MRP
        function updateMRP() {
            const basePrice = boxSizes[currentState.boxSize].price;
            let sweetsPrice = 0;
            
            Object.keys(currentState.selectedSweets).forEach(sweetId => {
                const sweet = sweets.find(s => s.id === parseInt(sweetId));
                if (sweet) {
                    sweetsPrice += sweet.price * currentState.selectedSweets[sweetId];
                }
            });
            
            const totalPrice = basePrice + sweetsPrice;
            mrpValue.textContent = `₹${totalPrice.toLocaleString('en-IN')}`;
        }

        // Clear all sweets from box
        async function clearAllSweets() {
            // Open lid if closed
            if (!currentState.lidOpen) {
                toggleLid();
            }
            
            // Animate removal of all sweets
            const removalPromises = [];
            
            for (const sweetId in modelParts.sweetMeshes) {
                const sweet = sweets.find(s => s.id === parseInt(sweetId));
                if (sweet) {
                    const sweetInstances = modelParts.sweetMeshes[sweetId];
                    for (const sweetData of sweetInstances) {
                        removalPromises.push(animateSweetOut(sweetData.mesh));
                    }
                }
            }
            
            // Wait for all animations
            await Promise.all(removalPromises);
            
            // Remove all sweet meshes from scene
            for (const sweetId in modelParts.sweetMeshes) {
                modelParts.sweetMeshes[sweetId].forEach(sweetData => {
                    scene.remove(sweetData.mesh);
                });
            }
            
            // Reset state
            modelParts.sweetMeshes = {};
            currentState.filledSlots.clear();
            currentState.selectedSweets = {};
            
            updateCapacity();
            updateMRP();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Control dial items
            controlItems.forEach(item => {
                item.addEventListener('click', () => {
                    const control = item.dataset.control;
                    
                    controlItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    
                    showSubOptions(control);
                });
            });

            // Box size selection
            sizeGrid.addEventListener('click', (e) => {
                const sizeOption = e.target.closest('.size-option');
                if (!sizeOption) return;
                
                document.querySelectorAll('.size-option').forEach(opt => opt.classList.remove('active'));
                sizeOption.classList.add('active');
                
                currentState.boxSize = sizeOption.dataset.size;
                
                // Clear sweets if new capacity is less than current sweets
                const totalSweets = Object.values(currentState.selectedSweets).reduce((a, b) => a + b, 0);
                const capacity = boxSizes[currentState.boxSize].capacity;
                
                if (totalSweets > capacity) {
                    clearAllSweets();
                }
                
                updateCapacity();
                updateMRP();
                
                showMessage(`Box size set to ${currentState.boxSize} Pc`);
            });

            // Reset button
            resetBtn.addEventListener('click', async () => {
                // Clear all sweets with animation
                await clearAllSweets();
                
                // Reset to defaults
                currentState = {
                    boxSize: '14',
                    boxColor: '#ff6b9d',
                    ribbon: 'red',
                    selectedSweets: {},
                    activeControl: 'box',
                    lidOpen: false,
                    filledSlots: new Set()
                };
                
                // Update UI
                controlItems.forEach(i => i.classList.remove('active'));
                controlItems[0].classList.add('active');
                showSubOptions('box');
                updateBoxColor();
                updateCapacity();
                updateMRP();
                
                // Close lid
                if (modelParts.lidOpen && modelParts.lidClosed) {
                    modelParts.lidOpen.visible = false;
                    modelParts.lidClosed.visible = true;
                }
                
                showMessage('All settings have been reset');
            });

            // Add to cart button
            cartBtn.addEventListener('click', async () => {
                const totalSweets = Object.values(currentState.selectedSweets).reduce((a, b) => a + b, 0);
                
                if (totalSweets === 0) {
                    showMessage('Please add some sweets to your box!', true);
                    return;
                }
                
                // Close lid for final view
                if (currentState.lidOpen) {
                    toggleLid();
                    await new Promise(resolve => setTimeout(resolve, 500)); // Wait for lid animation
                }
                
                showMessage(`${currentState.boxSize}Pc box added to cart!`);
                
                // Button animation
                cartBtn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    cartBtn.style.transform = 'scale(1)';
                }, 150);
            });
        }

        // Show sub-options based on selected control
        function showSubOptions(control) {
            currentState.activeControl = control;
            subTitle.textContent = getSubTitle(control);
            
            let content = '';
            
            switch(control) {
                case 'box':
                    content = `
                        <div class="size-grid">
                            <div class="size-option ${currentState.boxSize === '14' ? 'active' : ''}" data-size="14">
                                <div class="size-label">14 Pc</div>
                                <div class="size-desc">Small Box</div>
                            </div>
                            <div class="size-option ${currentState.boxSize === '20' ? 'active' : ''}" data-size="20">
                                <div class="size-label">20 Pc</div>
                                <div class="size-desc">Medium Box</div>
                            </div>
                            <div class="size-option ${currentState.boxSize === '30' ? 'active' : ''}" data-size="30">
                                <div class="size-label">30 Pc</div>
                                <div class="size-desc">Large Box</div>
                            </div>
                        </div>
                    `;
                    break;
                    
                case 'colour':
                    content = `
                        <div class="color-grid">
                            ${colors.map(color => `
                                <div class="color-option ${currentState.boxColor === color.value ? 'active' : ''}" 
                                     data-color="${color.value}"
                                     style="background-color: ${color.value};">
                                </div>
                            `).join('')}
                        </div>
                    `;
                    break;
                    
                case 'ribbon':
                    content = `
                        <div class="ribbon-grid">
                            ${ribbons.map(ribbon => `
                                <div class="ribbon-option ${currentState.ribbon === ribbon.value ? 'active' : ''}" 
                                     data-ribbon="${ribbon.value}">
                                    <div class="ribbon-label">${ribbon.name}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    break;
                    
                case 'content':
                    content = `
                        <div class="sweet-grid">
                            ${sweets.map(sweet => {
                                const quantity = currentState.selectedSweets[sweet.id] || 0;
                                return `
                                    <div class="sweet-option ${quantity > 0 ? 'selected' : ''}" data-id="${sweet.id}">
                                        <div class="sweet-icon">${sweet.icon}</div>
                                        <div class="sweet-name">${sweet.name}</div>
                                        <div class="sweet-price">₹${sweet.price}</div>
                                        <div class="quantity-controls">
                                            <button class="qty-btn decrease-btn">-</button>
                                            <span class="qty-display">${quantity}</span>
                                            <button class="qty-btn increase-btn">+</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `;
                    break;
            }
            
            subOptions.innerHTML = `<div class="sub-title">${getSubTitle(control)}</div>` + content;
            subOptions.classList.add('active');
            
            attachEventListenersToSubOptions();
        }

        function attachEventListenersToSubOptions() {
            const currentControl = currentState.activeControl;
            
            switch(currentControl) {
                case 'colour':
                    document.querySelectorAll('.color-option').forEach(option => {
                        option.addEventListener('click', () => {
                            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('active'));
                            option.classList.add('active');
                            currentState.boxColor = option.dataset.color;
                            updateBoxColor();
                            updateMRP();
                            showMessage(`Box color changed`);
                        });
                    });
                    break;
                    
                case 'ribbon':
                    document.querySelectorAll('.ribbon-option').forEach(option => {
                        option.addEventListener('click', () => {
                            document.querySelectorAll('.ribbon-option').forEach(opt => opt.classList.remove('active'));
                            option.classList.add('active');
                            currentState.ribbon = option.dataset.ribbon;
                            updateBoxColor();
                            updateMRP();
                            showMessage(`${option.querySelector('.ribbon-label').textContent} ribbon selected`);
                        });
                    });
                    break;
                    
                case 'content':
                    document.querySelectorAll('.sweet-option').forEach(option => {
                        const sweetId = parseInt(option.dataset.id);
                        const sweet = sweets.find(s => s.id === sweetId);
                        
                        // Add sweet
                        option.querySelector('.increase-btn').addEventListener('click', async (e) => {
                            e.stopPropagation();
                            
                            currentState.selectedSweets[sweetId] = (currentState.selectedSweets[sweetId] || 0) + 1;
                            updateSweetUI(sweetId);
                            
                            // Add sweet to box with animation
                            await addSweetToBox(sweet);
                            
                            updateCapacity();
                            updateMRP();
                        });
                        
                        // Remove sweet
                        option.querySelector('.decrease-btn').addEventListener('click', async (e) => {
                            e.stopPropagation();
                            if (currentState.selectedSweets[sweetId] > 0) {
                                currentState.selectedSweets[sweetId]--;
                                if (currentState.selectedSweets[sweetId] === 0) {
                                    delete currentState.selectedSweets[sweetId];
                                }
                                updateSweetUI(sweetId);
                                
                                // Remove sweet from box with animation
                                await removeSweetFromBox(sweet);
                                
                                updateCapacity();
                                updateMRP();
                            }
                        });
                    });
                    break;
            }
        }

        function updateSweetUI(sweetId) {
            const option = document.querySelector(`.sweet-option[data-id="${sweetId}"]`);
            if (!option) return;
            
            const quantity = currentState.selectedSweets[sweetId] || 0;
            option.querySelector('.qty-display').textContent = quantity;
            
            if (quantity > 0) {
                option.classList.add('selected');
            } else {
                option.classList.remove('selected');
            }
        }

        function getSubTitle(control) {
            switch(control) {
                case 'box': return 'SELECT BOX SIZE';
                case 'content': return 'SELECT SWEETS';
                case 'colour': return 'SELECT COLOUR';
                case 'ribbon': return 'SELECT RIBBON';
                default: return 'SELECT OPTION';
            }
        }

        function showMessage(text, isError = false) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                bottom: 180px;
                left: 50%;
                transform: translateX(-50%);
                background: ${isError ? '#ff4757' : '#4a6fa5'};
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                font-weight: 600;
                z-index: 1000;
                opacity: 0;
                transition: opacity 0.3s;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            `;
            notification.textContent = text;
            document.body.appendChild(notification);
            
            setTimeout(() => notification.style.opacity = '1', 10);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 300);
            }, 2000);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize the app
        init();
    </script>
</body>
</html>
